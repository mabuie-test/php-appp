<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin · Afiliados Profissional</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body class="page" data-page="affiliates-pro">
  <header class="topbar">
    <div class="header-content">
      <div class="logo-container">
        <div class="logo-icon">L</div>
        <div>
          <div class="logo-text">Admin · Afiliados</div>
          <div class="tagline">Campanhas, materiais e controlo operacional</div>
        </div>
      </div>
      <nav class="navbar"><div class="nav-links"><a href="/admin.html">Dashboard</a><a href="/admin-metrics.html">Métricas</a><button id="logout" class="ghost">Terminar sessão</button></div></nav>
    </div>
  </header>

  <main class="content grid-two">
    <section class="card">
      <h1>Controlo operacional</h1>
      <div id="af-control" class="list"></div>
      <form id="af-settings-form" class="stacked" style="margin-top:10px">
        <div class="inline-group">
          <label>Comissão base % <input id="af-base-commission" type="number" min="0" max="100" /></label>
          <label>Janela conversão (dias) <input id="af-window-days" type="number" min="1" max="90" /></label>
        </div>
        <div class="inline-group">
          <label><input id="af-volume-bonus" type="checkbox" /> Bónus de volume</label>
          <label><input id="af-special-bonus" type="checkbox" /> Bónus campanhas especiais</label>
          <label>Modelo <select id="af-attribution-model"><option value="last_click">last_click</option><option value="first_click">first_click</option></select></label>
        </div>
        <button class="ghost" type="submit">Guardar configurações</button>
      </form>

      <h2 style="margin-top:1rem">Comissões</h2>
      <div id="admin-commissions" class="list"></div>

      <h2 style="margin-top:1rem">Pagamentos</h2>
      <div id="admin-payouts" class="list"></div>
    </section>

    <section class="card">
      <h1>Campanhas de afiliados</h1>
      <form id="af-campaign-form" class="stacked">
        <input id="af-campaign-name" placeholder="Nome da campanha" required />
        <input id="af-campaign-offer" placeholder="Oferta" required />
        <div class="inline-group">
          <input id="af-campaign-channel" placeholder="Canal (whatsapp, instagram...)" />
          <input id="af-campaign-bonus" type="number" min="0" max="100" placeholder="Bónus comissão %" />
          <select id="af-campaign-status"><option value="active">Ativa</option><option value="paused">Pausada</option></select>
        </div>
        <button class="primary" type="submit">Guardar campanha</button>
      </form>
      <div id="af-campaigns" class="list" style="margin-top:10px"></div>

      <h2 style="margin-top:1rem">Biblioteca de materiais</h2>
      <form id="af-material-form" class="stacked">
        <input id="af-material-title" placeholder="Título do material" required />
        <input id="af-material-url" placeholder="URL do material" required />
        <div class="inline-group">
          <input id="af-material-type" placeholder="Tipo (banner, copy, video)" />
          <select id="af-material-status"><option value="active">Ativo</option><option value="paused">Pausado</option></select>
          <button class="ghost" type="submit">Guardar material</button>
        </div>
      </form>
      <div id="af-materials" class="list" style="margin-top:10px"></div>
    </section>
  </main>

  <footer class="footer"><p class="muted">© 2024 Fluxosoftwares</p></footer>

  <script>
    const apiBase = '/api';
    const token = localStorage.getItem('token') || '';
    const headers = token ? { Authorization: `Bearer ${token}` } : {};
    let currentCampaigns = [];
    let currentMaterials = [];

    function toast(t){ alert(t); }

    async function loadControl() {
      const box = document.getElementById('af-control');
      const res = await fetch(`${apiBase}/admin/affiliates/control`, { headers });
      const data = await res.json();
      if (!res.ok) { box.innerHTML = `<p class="muted">${data.message || 'Erro'}</p>`; return; }
      const t = data.totals || {};
      const s = data.settings || {};
      box.innerHTML = `
        <div class="list-item"><div><strong>Cliques 24h</strong><p class="muted">${t.clicks_24h ?? 0}</p></div></div>
        <div class="list-item"><div><strong>Novas comissões 24h</strong><p class="muted">${t.new_commissions_24h ?? 0}</p></div></div>
        <div class="list-item"><div><strong>Payouts pendentes</strong><p class="muted">${t.pending_payouts ?? 0}</p></div></div>
        <div class="list-item"><div><strong>Modelo atribuição</strong><p class="muted">${s.attribution_model || 'last_click'} · janela ${s.conversion_window_days || 30} dias</p></div></div>
      `;
      document.getElementById('af-base-commission').value = s.base_commission_percent ?? 18;
      document.getElementById('af-window-days').value = s.conversion_window_days ?? 30;
      document.getElementById('af-volume-bonus').checked = !!s.volume_bonus_enabled;
      document.getElementById('af-special-bonus').checked = !!s.special_campaign_bonus_enabled;
      document.getElementById('af-attribution-model').value = s.attribution_model || 'last_click';
    }

    async function saveSettings(e){
      e.preventDefault();
      const body = {
        base_commission_percent: Number(document.getElementById('af-base-commission').value || 18),
        conversion_window_days: Number(document.getElementById('af-window-days').value || 30),
        volume_bonus_enabled: document.getElementById('af-volume-bonus').checked ? 1 : 0,
        special_campaign_bonus_enabled: document.getElementById('af-special-bonus').checked ? 1 : 0,
        attribution_model: document.getElementById('af-attribution-model').value,
      };
      const res = await fetch(`${apiBase}/admin/affiliates/settings/save`, { method: 'POST', headers: { ...headers, 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
      const data = await res.json();
      if (!res.ok) return toast(data.message || 'Erro');
      toast('Configurações guardadas');
      loadControl();
    }

    async function loadCommissions() {
      const box = document.getElementById('admin-commissions');
      const res = await fetch(`${apiBase}/admin/commissions`, { headers });
      const data = await res.json();
      if (!res.ok) { box.innerHTML = `<p class="muted">${data.message || 'Erro'}</p>`; return; }
      box.innerHTML = (data.commissions || []).slice(0, 20).map((c) => `<div class="list-item"><div>#${c.order_id} · ${c.referrer_code} · ${c.amount} MZN</div><span class="badge">${c.status}</span></div>`).join('') || '<p class="muted">Sem dados</p>';
    }

    async function loadPayouts() {
      const box = document.getElementById('admin-payouts');
      const res = await fetch(`${apiBase}/admin/payouts`, { headers });
      const data = await res.json();
      if (!res.ok) { box.innerHTML = `<p class="muted">${data.message || 'Erro'}</p>`; return; }
      box.innerHTML = (data.payouts || []).slice(0, 20).map((p) => `<div class="list-item"><div>#${p.id} · ${p.email || ''} · ${p.valor} MZN</div><span class="badge">${p.status}</span></div>`).join('') || '<p class="muted">Sem dados</p>';
    }

    async function loadCampaigns() {
      const box = document.getElementById('af-campaigns');
      const res = await fetch(`${apiBase}/admin/affiliates/campaigns`, { headers });
      const data = await res.json();
      if (!res.ok) { box.innerHTML = `<p class="muted">${data.message || 'Erro'}</p>`; return; }
      currentCampaigns = data.campaigns || [];
      box.innerHTML = currentCampaigns.map((c) => `<div class="list-item"><div><strong>${c.name}</strong><p class="muted">${c.offer} · ${c.channel}</p></div><div class="inline-group"><span class="badge">${c.status || 'active'} · +${c.commission_bonus_percent || 0}%</span><button class="ghost" onclick="toggleCampaignStatus('${c.id}', '${(c.status || 'active') === 'active' ? 'paused' : 'active'}')">${(c.status || 'active') === 'active' ? 'Pausar' : 'Ativar'}</button><button class="ghost" onclick="editCampaign('${c.id}')">Editar</button><button class="ghost" onclick="deleteCampaign('${c.id}')">Remover</button></div></div>`).join('') || '<p class="muted">Sem campanhas</p>';
    }

    async function loadMaterials() {
      const box = document.getElementById('af-materials');
      const res = await fetch(`${apiBase}/admin/affiliates/materials`, { headers });
      const data = await res.json();
      if (!res.ok) { box.innerHTML = `<p class="muted">${data.message || 'Erro'}</p>`; return; }
      currentMaterials = data.materials || [];
      box.innerHTML = currentMaterials.map((m) => `<div class="list-item"><div><strong>${m.title}</strong><p class="muted">${m.type}</p></div><div class="inline-group"><span class="badge">${m.status || 'active'}</span><a class="ghost" href="${m.url}" target="_blank">Abrir</a><button class="ghost" onclick="toggleMaterialStatus('${m.id}', '${(m.status || 'active') === 'active' ? 'paused' : 'active'}')">${(m.status || 'active') === 'active' ? 'Pausar' : 'Ativar'}</button><button class="ghost" onclick="editMaterial('${m.id}')">Editar</button><button class="ghost" onclick="deleteMaterial('${m.id}')">Remover</button></div></div>`).join('') || '<p class="muted">Sem materiais</p>';
    }

    async function saveCampaign(e) {
      e.preventDefault();
      const body = {
        id: document.getElementById('af-campaign-form').dataset.editId || '',
        name: document.getElementById('af-campaign-name').value,
        offer: document.getElementById('af-campaign-offer').value,
        channel: document.getElementById('af-campaign-channel').value,
        commission_bonus_percent: Number(document.getElementById('af-campaign-bonus').value || 0),
        status: document.getElementById('af-campaign-status').value,
      };
      const res = await fetch(`${apiBase}/admin/affiliates/campaigns/save`, { method: 'POST', headers: { ...headers, 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
      const data = await res.json();
      if (!res.ok) return toast(data.message || 'Erro');
      toast('Campanha guardada');
      e.target.reset();
      e.target.dataset.editId = '';
      loadCampaigns();
    }

    async function saveMaterial(e) {
      e.preventDefault();
      const body = {
        id: document.getElementById('af-material-form').dataset.editId || '',
        title: document.getElementById('af-material-title').value,
        url: document.getElementById('af-material-url').value,
        type: document.getElementById('af-material-type').value,
        status: document.getElementById('af-material-status').value,
      };
      const res = await fetch(`${apiBase}/admin/affiliates/materials/save`, { method: 'POST', headers: { ...headers, 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
      const data = await res.json();
      if (!res.ok) return toast(data.message || 'Erro');
      toast('Material guardado');
      e.target.reset();
      e.target.dataset.editId = '';
      loadMaterials();
    }


    window.toggleCampaignStatus = async function(id, status){
      const c = currentCampaigns.find(x => x.id === id); if (!c) return;
      const body = { ...c, id, status };
      const res = await fetch(`${apiBase}/admin/affiliates/campaigns/save`, { method: 'POST', headers: { ...headers, 'Content-Type':'application/json' }, body: JSON.stringify(body) });
      const data = await res.json();
      if (!res.ok) return toast(data.message || 'Erro');
      toast('Estado da campanha atualizado');
      loadCampaigns();
    }

    window.toggleMaterialStatus = async function(id, status){
      const m = currentMaterials.find(x => x.id === id); if (!m) return;
      const body = { ...m, id, status };
      const res = await fetch(`${apiBase}/admin/affiliates/materials/save`, { method: 'POST', headers: { ...headers, 'Content-Type':'application/json' }, body: JSON.stringify(body) });
      const data = await res.json();
      if (!res.ok) return toast(data.message || 'Erro');
      toast('Estado do material atualizado');
      loadMaterials();
    }

    window.editCampaign = function(id){
      const c = currentCampaigns.find(x => x.id === id); if (!c) return;
      document.getElementById('af-campaign-name').value = c.name || '';
      document.getElementById('af-campaign-offer').value = c.offer || '';
      document.getElementById('af-campaign-channel').value = c.channel || '';
      document.getElementById('af-campaign-bonus').value = c.commission_bonus_percent || 0;
      document.getElementById('af-campaign-status').value = c.status || 'active';
      document.getElementById('af-campaign-form').dataset.editId = c.id;
      toast('Editar campanha: após ajustar, clique Guardar campanha.');
    }

    window.deleteCampaign = async function(id){
      if (!confirm('Remover campanha?')) return;
      const res = await fetch(`${apiBase}/admin/affiliates/campaigns/delete`, { method: 'POST', headers: { ...headers, 'Content-Type':'application/json' }, body: JSON.stringify({ id }) });
      const data = await res.json();
      if (!res.ok) return toast(data.message || 'Erro');
      toast('Campanha removida');
      loadCampaigns();
    }

    window.editMaterial = function(id){
      const m = currentMaterials.find(x => x.id === id); if (!m) return;
      document.getElementById('af-material-title').value = m.title || '';
      document.getElementById('af-material-url').value = m.url || '';
      document.getElementById('af-material-type').value = m.type || '';
      document.getElementById('af-material-status').value = m.status || 'active';
      document.getElementById('af-material-form').dataset.editId = m.id;
      toast('Editar material: após ajustar, clique Guardar material.');
    }

    window.deleteMaterial = async function(id){
      if (!confirm('Remover material?')) return;
      const res = await fetch(`${apiBase}/admin/affiliates/materials/delete`, { method: 'POST', headers: { ...headers, 'Content-Type':'application/json' }, body: JSON.stringify({ id }) });
      const data = await res.json();
      if (!res.ok) return toast(data.message || 'Erro');
      toast('Material removido');
      loadMaterials();
    }

    document.getElementById('af-settings-form')?.addEventListener('submit', saveSettings);
    document.getElementById('af-campaign-form')?.addEventListener('submit', saveCampaign);
    document.getElementById('af-material-form')?.addEventListener('submit', saveMaterial);
    document.getElementById('logout')?.addEventListener('click', () => { localStorage.removeItem('token'); localStorage.removeItem('role'); location.href='/login.html'; });

    Promise.all([loadControl(), loadCommissions(), loadPayouts(), loadCampaigns(), loadMaterials()]);
  </script>
  <script src="/nav-mobile.js"></script>
</body>
</html>
