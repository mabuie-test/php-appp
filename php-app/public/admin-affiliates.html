<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin · Afiliados Profissional</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body class="page" data-page="affiliates-pro">
  <header class="topbar">
    <div class="header-content">
      <div class="logo-container">
        <div class="logo-icon">L</div>
        <div>
          <div class="logo-text">Admin · Afiliados</div>
          <div class="tagline">Campanhas, materiais e controlo operacional</div>
        </div>
      </div>
      <nav class="navbar"><div class="nav-links"><a href="/admin.html">Dashboard</a><a href="/admin-metrics.html">Métricas</a><button id="logout" class="ghost">Terminar sessão</button></div></nav>
    </div>
  </header>

  <main class="content grid-two">
    <section class="card">
      <h1>Controlo operacional</h1>
      <div id="af-control" class="list"></div>

      <h2 style="margin-top:1rem">Comissões</h2>
      <div id="admin-commissions" class="list"></div>

      <h2 style="margin-top:1rem">Pagamentos</h2>
      <div id="admin-payouts" class="list"></div>
    </section>

    <section class="card">
      <h1>Campanhas de afiliados</h1>
      <form id="af-campaign-form" class="stacked">
        <input id="af-campaign-name" placeholder="Nome da campanha" required />
        <input id="af-campaign-offer" placeholder="Oferta" required />
        <div class="inline-group">
          <input id="af-campaign-channel" placeholder="Canal (whatsapp, instagram...)" />
          <input id="af-campaign-bonus" type="number" min="0" max="100" placeholder="Bónus comissão %" />
        </div>
        <button class="primary" type="submit">Guardar campanha</button>
      </form>
      <div id="af-campaigns" class="list" style="margin-top:10px"></div>

      <h2 style="margin-top:1rem">Biblioteca de materiais</h2>
      <form id="af-material-form" class="stacked">
        <input id="af-material-title" placeholder="Título do material" required />
        <input id="af-material-url" placeholder="URL do material" required />
        <div class="inline-group">
          <input id="af-material-type" placeholder="Tipo (banner, copy, video)" />
          <button class="ghost" type="submit">Guardar material</button>
        </div>
      </form>
      <div id="af-materials" class="list" style="margin-top:10px"></div>
    </section>
  </main>

  <footer class="footer"><p class="muted">© 2024 Fluxosoftwares</p></footer>

  <script>
    const apiBase = '/api';
    const token = localStorage.getItem('token') || '';
    const headers = token ? { Authorization: `Bearer ${token}` } : {};

    function toast(t){ alert(t); }

    async function loadControl() {
      const box = document.getElementById('af-control');
      const res = await fetch(`${apiBase}/admin/affiliates/control`, { headers });
      const data = await res.json();
      if (!res.ok) { box.innerHTML = `<p class="muted">${data.message || 'Erro'}</p>`; return; }
      const t = data.totals || {};
      const s = data.settings || {};
      box.innerHTML = `
        <div class="list-item"><div><strong>Cliques 24h</strong><p class="muted">${t.clicks_24h ?? 0}</p></div></div>
        <div class="list-item"><div><strong>Novas comissões 24h</strong><p class="muted">${t.new_commissions_24h ?? 0}</p></div></div>
        <div class="list-item"><div><strong>Payouts pendentes</strong><p class="muted">${t.pending_payouts ?? 0}</p></div></div>
        <div class="list-item"><div><strong>Modelo atribuição</strong><p class="muted">${s.attribution_model || 'last_click'} · janela ${s.conversion_window_days || 30} dias</p></div></div>
      `;
    }

    async function loadCommissions() {
      const box = document.getElementById('admin-commissions');
      const res = await fetch(`${apiBase}/admin/commissions`, { headers });
      const data = await res.json();
      if (!res.ok) { box.innerHTML = `<p class="muted">${data.message || 'Erro'}</p>`; return; }
      box.innerHTML = (data.commissions || []).slice(0, 20).map((c) => `<div class="list-item"><div>#${c.order_id} · ${c.referrer_code} · ${c.amount} MZN</div><span class="badge">${c.status}</span></div>`).join('') || '<p class="muted">Sem dados</p>';
    }

    async function loadPayouts() {
      const box = document.getElementById('admin-payouts');
      const res = await fetch(`${apiBase}/admin/payouts`, { headers });
      const data = await res.json();
      if (!res.ok) { box.innerHTML = `<p class="muted">${data.message || 'Erro'}</p>`; return; }
      box.innerHTML = (data.payouts || []).slice(0, 20).map((p) => `<div class="list-item"><div>#${p.id} · ${p.email || ''} · ${p.valor} MZN</div><span class="badge">${p.status}</span></div>`).join('') || '<p class="muted">Sem dados</p>';
    }

    async function loadCampaigns() {
      const box = document.getElementById('af-campaigns');
      const res = await fetch(`${apiBase}/admin/affiliates/campaigns`, { headers });
      const data = await res.json();
      if (!res.ok) { box.innerHTML = `<p class="muted">${data.message || 'Erro'}</p>`; return; }
      box.innerHTML = (data.campaigns || []).map((c) => `<div class="list-item"><div><strong>${c.name}</strong><p class="muted">${c.offer} · ${c.channel}</p></div><span class="badge">+${c.commission_bonus_percent || 0}%</span></div>`).join('') || '<p class="muted">Sem campanhas</p>';
    }

    async function loadMaterials() {
      const box = document.getElementById('af-materials');
      const res = await fetch(`${apiBase}/admin/affiliates/materials`, { headers });
      const data = await res.json();
      if (!res.ok) { box.innerHTML = `<p class="muted">${data.message || 'Erro'}</p>`; return; }
      box.innerHTML = (data.materials || []).map((m) => `<div class="list-item"><div><strong>${m.title}</strong><p class="muted">${m.type}</p></div><a class="ghost" href="${m.url}" target="_blank">Abrir</a></div>`).join('') || '<p class="muted">Sem materiais</p>';
    }

    async function saveCampaign(e) {
      e.preventDefault();
      const body = {
        name: document.getElementById('af-campaign-name').value,
        offer: document.getElementById('af-campaign-offer').value,
        channel: document.getElementById('af-campaign-channel').value,
        commission_bonus_percent: Number(document.getElementById('af-campaign-bonus').value || 0),
      };
      const res = await fetch(`${apiBase}/admin/affiliates/campaigns/save`, { method: 'POST', headers: { ...headers, 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
      const data = await res.json();
      if (!res.ok) return toast(data.message || 'Erro');
      toast('Campanha guardada');
      e.target.reset();
      loadCampaigns();
    }

    async function saveMaterial(e) {
      e.preventDefault();
      const body = {
        title: document.getElementById('af-material-title').value,
        url: document.getElementById('af-material-url').value,
        type: document.getElementById('af-material-type').value,
      };
      const res = await fetch(`${apiBase}/admin/affiliates/materials/save`, { method: 'POST', headers: { ...headers, 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
      const data = await res.json();
      if (!res.ok) return toast(data.message || 'Erro');
      toast('Material guardado');
      e.target.reset();
      loadMaterials();
    }

    document.getElementById('af-campaign-form')?.addEventListener('submit', saveCampaign);
    document.getElementById('af-material-form')?.addEventListener('submit', saveMaterial);
    document.getElementById('logout')?.addEventListener('click', () => { localStorage.removeItem('token'); localStorage.removeItem('role'); location.href='/login.html'; });

    Promise.all([loadControl(), loadCommissions(), loadPayouts(), loadCampaigns(), loadMaterials()]);
  </script>
  <script src="/nav-mobile.js"></script>
</body>
</html>
